name: Destroy app stack

on:
  workflow_dispatch:

# 和 deploy 用同一个 group，保证两者不会同时改 state
concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  destroy_stack:
    runs-on: ubuntu-latest

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v7

    # Install the latest version of Terraform CLI
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4

    # Initialize a new or existing Terraform working directory, loading the remote state
    # 注意：用 S3 backend 时 init 阶段也要连 AWS，所以这一步同样需要凭证
    - name: Terraform Init
      run: terraform init
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

    # Tear down everything this stack created
    - name: Terraform Destroy
      run: terraform destroy -no-color -auto-approve
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
